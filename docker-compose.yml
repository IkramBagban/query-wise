services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querywise
      POSTGRES_PASSWORD: querywise
      POSTGRES_DB: querywise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querywise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web is run locally via `pnpm dev` or deployed to Vercel — not needed here
  # web:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.web
  #   env_file: .env
  #   ports:
  #     - "4100:4100"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
