name: Deploy Worker to Production VM
# NOTE: Only the worker is deployed to the VM.
# - Web & Admin → Vercel (auto-deployed on push to prod)
# - Redis       → Redis Cloud (hosted, no VM service needed)

on: 
  workflow_dispatch: 
  push:
    branches:
      - prod

jobs:
  build-and-push:
    name: Build and Push Worker Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ikrambagban
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Web is deployed to Vercel — no need to build/push web image
      # - name: Build and push Web Image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: docker/Dockerfile.web
      #     push: true
      #     tags: ikrambagban/query-wise-web:latest
      #     build-args: |
      #       NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
      #       NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      #       NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
      #       NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}

      - name: Build and push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ikrambagban/query-wise-worker:latest

  deploy:
    name: Deploy Worker to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/query-wise"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/query-wise || exit 1
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ikrambagban --password-stdin

            # Generate the .env file dynamically from GitHub Secrets
            # Only worker-relevant env vars are needed here.
            # Web/Admin env vars are managed in Vercel project settings.
            cat << 'EOF' > .env
            QUERYWISE_APP_DATABASE_URL=${{ secrets.QUERYWISE_APP_DATABASE_URL }}
            QUERYWISE_REDIS_URL=${{ secrets.QUERYWISE_REDIS_URL }}
            QUERYWISE_INGESTION_LLM_PROVIDER=${{ secrets.QUERYWISE_INGESTION_LLM_PROVIDER }}
            QUERYWISE_INGESTION_LLM_MODEL=${{ secrets.QUERYWISE_INGESTION_LLM_MODEL }}
            QUERYWISE_INGESTION_LLM_API_KEY=${{ secrets.QUERYWISE_INGESTION_LLM_API_KEY }}
            QUERYWISE_LLM_INCLUDE_SAMPLE_ROWS=${{ secrets.QUERYWISE_LLM_INCLUDE_SAMPLE_ROWS }}
            GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            NODE_ENV=production
            EOF

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old unused images to save disk space
            docker system prune -f
