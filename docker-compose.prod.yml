services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: ikrambagban/query-wise-web:latest
    env_file: .env
    ports:
      - "4100:4100"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ikrambagban/query-wise-worker:latest
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

